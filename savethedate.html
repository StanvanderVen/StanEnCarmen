<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date!</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #f3e6da;
            background-image: url("Bali-berg.jpeg");
            font-family: 'Georgia', serif; margin: 0; overflow: hidden;
        }

        /* Landscape adjustments */
        @media (orientation: landscape) {
            body { justify-content: flex-start; padding-left: 10%; background-image: url("Bali-berg-landscape.jpeg"); }
        }

        .envelope-wrapper { position: relative; cursor: pointer; width: 100%; max-width: 450px; transform: rotate(90deg) scale(4); transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .envelope-wrapper.open { transform: translateY(160px) rotate(0deg) scale(1); }

        .envelope { position: relative; width: 100%; aspect-ratio: 450 / 300; background-color: #ccb6a1; border-radius: 4px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }

        /* Secret Content */
        .secret-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        .secret-content.show { opacity: 1; }
        .secret-content img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }

        .flap-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }

        /* Flap Styles */
        .top-flap-wrapper { z-index: 4; transform-origin: top; transition: transform 0.8s; }
        .bottom-flap-wrapper { z-index: 5; transform-origin: bottom; transition: transform 0.8s; cursor: pointer; }
        .side-flaps-wrapper { z-index: 3; }

        /* Animation Classes */
        .envelope.unlocked .bottom-flap-wrapper { transform: rotateX(-180deg) !important; z-index: 10 !important; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) !important;}
        .envelope.unlocked .flap-left { transform: rotateY(180deg); transform-origin: left; transition: transform 0.8s; }
        .envelope.unlocked .flap-right { transform: rotateY(-180deg); transform-origin: right; transition: transform 0.8s; }
        .envelope.unlocked .wax-seal { opacity: 0; transform: scale(0); transition: 0.3s; }

        .wax-seal { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); width: 45px; height: 45px; background: #962d2d; border-radius: 50%; z-index: 6; }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
        <div class="envelope" id="envelope">
            
            <div class="secret-content" id="secretContent">
                <img src="klooster.webp" alt="Secret">
            </div>

            <div class="wax-seal"></div>

            <div class="flap-container side-flaps-wrapper">
                <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path class="flap-left" d="M0,0 L50,50 L0,100 Z" fill="#ccb6a1" />
                    <path class="flap-right" d="M100,0 L50,50 L100,100 Z" fill="#ccb6a1" />
                </svg>
            </div>

            <div class="flap-container bottom-flap-wrapper" id="bottomFlap">
                <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M0,100 L100,100 L50,50 Z" fill="#ccb6a1" />
                </svg>
            </div>

            <div class="flap-container top-flap-wrapper">
                <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M0,0 L100,0 L50,50 Z" fill="#ccb6a1" />
                </svg>
            </div>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const envelope = document.getElementById('envelope');

        function openEnvelope() {
            document.getElementById('envelopeWrapper').classList.add('open');
        }

        document.getElementById('bottomFlap').addEventListener('click', function(e) {
            e.stopPropagation();
            clickCount++;
            
            if (clickCount >= 5) {
                envelope.classList.add('unlocked');
                document.getElementById('secretContent').classList.add('show');
            } else {
                this.style.transform = 'translateY(-10px)';
                setTimeout(() => { this.style.transform = 'translateY(0)'; }, 150);
            }
        });
    </script>
</body>
</html>
